name: Build Setup
description: Setup Node/PNPM/EAS and install dependencies

inputs:
  expo-token:
    description: Expo token for EAS authentication
    required: true

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v3
      with:
        node-version: '20'

    - name: Setup PNPM
      uses: pnpm/action-setup@v2
      with:
        version: 10

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Setup EAS
      uses: expo/expo-github-action@v8
      with:
        eas-version: latest
        token: ${{ inputs.expo-token }}
