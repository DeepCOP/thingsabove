name: Build Setup
description: Setup, build, and submit to app stores

inputs:
  expo-token:
    description: Expo token for EAS authentication
    required: true
  platform:
    description: Platform to build for (android or ios)
    required: true
  eas-profile:
    description: EAS build profile name
    required: true

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: '24'

    - name: Setup PNPM
      uses: pnpm/action-setup@v6
      with:
        version: 10

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Setup EAS
      uses: expo/expo-github-action@v9
      with:
        eas-version: latest
        token: ${{ inputs.expo-token }}
        packager: pnpm

    - name: Build & Submit
      shell: bash
      run: eas build --platform ${{ inputs.platform }} --profile ${{ inputs.eas-profile }} --auto-submit --non-interactive --wait
