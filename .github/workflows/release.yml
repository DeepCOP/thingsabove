name: Build and Release

on:
  push:
    tags:
      - '*'

env:
  EAS_PROFILE: beta

jobs:
  build_android:
    runs-on: ubuntu-latest

    steps:
      - uses: ./.github/actions/build-setup
        with:
          expo-token: ${{ secrets.EXPO_TOKEN }}

      - name: Build & Submit to Google Play
        run: eas build --platform android --profile $EAS_PROFILE --auto-submit --non-interactive --wait

  build_ios:
    runs-on: ubuntu-latest

    steps:
      - uses: ./.github/actions/build-setup
        with:
          expo-token: ${{ secrets.EXPO_TOKEN }}

      - name: Build & Submit iOS
        run: eas build --platform ios --profile $EAS_PROFILE --auto-submit --non-interactive --wait

  create_release:
    runs-on: ubuntu-latest
    needs: [build_android, build_ios]
    steps:
      - uses: actions/checkout@v3

      - name: Get app version
        run: echo "APP_VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_ENV

      - name: GitHub Release Description
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ env.APP_VERSION }}
          body: |
            iOS Beta Build (TestFlight)
            - [Install via TestFlight](https://testflight.apple.com/join/j6Qs882p)

            Android Beta Build
            - [Install via Google Play Testing](https://play.google.com/apps/testing/life.thingsabove.app)

          generate_release_notes: true
          draft: false
          prerelease: false
