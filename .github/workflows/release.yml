name: Build and Release

on:
  push:
    tags:
      - '*'

env:
  IS_BETA: ${{ contains(github.ref_name, 'beta') }}

jobs:
  build_android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - uses: ./.github/actions/build-and-submit
        with:
          expo-token: ${{ secrets.EXPO_TOKEN }}
          platform: android
          eas-profile: ${{ env.IS_BETA == 'true' && 'preview' || 'production' }}

  build_ios:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - uses: ./.github/actions/build-and-submit
        with:
          expo-token: ${{ secrets.EXPO_TOKEN }}
          platform: ios
          eas-profile: ${{ env.IS_BETA == 'true' && 'preview' || 'production' }}

  create_release:
    runs-on: ubuntu-latest
    needs: [build_android, build_ios]
    steps:
      - uses: actions/checkout@v3

      - name: Get app version
        run: echo "APP_VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_ENV

      - name: GitHub Release Description
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ env.APP_VERSION }}
          body: |
            ${{ env.IS_BETA == 'true' && 'iOS Beta Build (TestFlight)' || 'iOS Production Build (App Store)' }}
            ${{ env.IS_BETA == 'true' && '- [Install via TestFlight](https://testflight.apple.com/join/j6Qs882p)' || '- [Download on the App Store](https://apps.apple.com/app/id6759932294)' }}

            ${{ env.IS_BETA == 'true' && 'Android Beta Build' || 'Android Production Build' }}
            ${{ env.IS_BETA == 'true' && '- [Install via Google Play Testing](https://play.google.com/apps/testing/life.thingsabove)' || '- [Get it on Google Play](https://play.google.com/store/apps/details?id=life.thingsabove)' }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ env.IS_BETA == 'true' && 'true' || 'false' }}
