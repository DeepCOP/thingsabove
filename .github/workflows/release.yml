name: EAS Build and Upload Android Release Asset

on:
  push:
    tags:
      - '*'

jobs:
  build_android_release:
    runs-on: ubuntu-latest
    env:
      EAS_PROFILE: preview

    steps:
      - name: 🏗️ Checkout repo
        uses: actions/checkout@v3

      - name: 🏗️ Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: 🏗️ Setup PNPM
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔖 Get app version
        run: echo "APP_VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_ENV

      - name: 🏗️ Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Build Android (APK)
        run: |
          eas build --platform android --profile $EAS_PROFILE --non-interactive --wait --json > android-build.json

      - name: ⬇️ Download Android artifact
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('android-build.json', 'utf8'));
          const build = Array.isArray(data) ? data[0] : data;
          const url =
            build?.artifacts?.applicationArchiveUrl ||
            build?.artifacts?.buildUrl ||
            build?.artifacts?.downloadUrl ||
            build?.buildUrl;
          if (!url) {
            console.error('No artifact URL found in android-build.json');
            process.exit(1);
          }
          fs.writeFileSync('android-build-url.txt', url);
          NODE
          mkdir -p build
          curl -L "$(cat android-build-url.txt)" -o build/thingsabove-${{ env.APP_VERSION }}.apk

      - name: 🔍 Verify APK exists
        run: |
          if [ ! -f build/thingsabove-${{ env.APP_VERSION }}.apk ]; then
            echo "❌ APK not found"
            exit 1
          fi
          echo "✅ APK ready"

      - name: 🚀 Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ env.APP_VERSION }}
          body: |
            🚀 Android Production Build

            Version: ${{ env.APP_VERSION }}
            Tag: ${{ github.ref_name }}
            Profile: ${{ env.EAS_PROFILE }}

            Built via EAS Cloud.
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            build/thingsabove-${{ env.APP_VERSION }}.apk
