name: EAS Build and Upload Android Release Asset

on:
  push:
    tags:
      - 'v*'

jobs:
  build_android_release:
    runs-on: ubuntu-latest
    env:
      EAS_PROFILE: preview

    steps:
      - name: 🏗️ Checkout repo
        uses: actions/checkout@v3

      - name: 🏗️ Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: 🏗️ Setup PNPM
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 🏷️ Set version from tag
        run: |
          TAG_NAME="${{ github.ref_name }}"
          VERSION="${TAG_NAME#v}"
          node -e "const fs=require('fs');const path='package.json';const pkg=JSON.parse(fs.readFileSync(path,'utf8'));pkg.version='${VERSION}';fs.writeFileSync(path, JSON.stringify(pkg,null,2)+'\n');"
          node -e "const fs=require('fs');const path='app.config.js';let text=fs.readFileSync(path,'utf8');text=text.replace(/version:\\s*'[^']*'/, \"version: '${VERSION}'\");fs.writeFileSync(path, text);"

      - name: 📦 Build Android (APK)
        run: |
          eas build --platform android --profile $EAS_PROFILE --non-interactive --wait --json > android-build.json

      - name: ⬇️ Download Android artifact
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('android-build.json', 'utf8'));
          const build = Array.isArray(data) ? data[0] : data;
          const url =
            build?.artifacts?.applicationArchiveUrl ||
            build?.artifacts?.buildUrl ||
            build?.artifacts?.downloadUrl ||
            build?.buildUrl;
          if (!url) {
            console.error('No artifact URL found in android-build.json');
            process.exit(1);
          }
          fs.writeFileSync('android-build-url.txt', url);
          NODE
          mkdir -p build
          curl -L "$(cat android-build-url.txt)" -o build/app-android.apk

      - name: 🔍 Verify APK exists
        run: |
          if [ ! -f build/app-android.apk ]; then
            echo "❌ APK not found"
            exit 1
          fi
          echo "✅ APK ready"

      - name: 🚀 Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            🚀 Android Production Build

            Version: ${{ github.ref_name }}
            Profile: ${{ env.EAS_PROFILE }}

            Built via EAS Cloud.
          draft: false
          prerelease: false
          files: |
            build/app-android.apk
