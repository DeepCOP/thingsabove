name: OTA Update (Preview)

on:
  push:
    branches:
      - main

concurrency:
  group: ota-preview
  cancel-in-progress: false

jobs:
  ota_preview:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - uses: ./.github/actions/ota-update
        with:
          expo-token: ${{ secrets.EXPO_TOKEN }}
          profile: preview
